plugins {
    alias(libs.plugins.android.application)
    id 'jacoco'
}

android {
    namespace 'com.qos.latency.analyzer'
    compileSdk 34

    defaultConfig {
        applicationId "com.qos.latency.analyzer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// ================================
// CONFIGURATION DES SOURCES APPIUM
// ================================
sourceSets {
    appiumTest {
        java {
            srcDir 'src/appiumTest/java'
        }
        resources {
            srcDir 'src/appiumTest/resources'
        }
    }
}

// ================================
// CONFIGURATIONS
// ================================
configurations {
    appiumTestImplementation.extendsFrom testImplementation
    appiumTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // ================================
    // DÉPENDANCES ANDROID DE BASE
    // ================================
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ================================
    // TESTS UNITAIRES (JUnit 4)
    // ================================
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.json:json:20231013'

    // ================================
    // TESTS INSTRUMENTÉS (ESPRESSO)
    // ================================
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    // ================================
    // TESTS APPIUM (JUnit 5)
    // ================================
    appiumTestImplementation 'io.appium:java-client:9.2.0'
    appiumTestImplementation 'org.seleniumhq.selenium:selenium-java:4.18.1'
    appiumTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    appiumTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    appiumTestRuntimeOnly 'org.junit.platform:junit-platform-console:1.10.2'
}

// ================================
// CONFIGURATION JACOCO
// ================================
jacoco {
    toolVersion = "0.8.11"
}

afterEvaluate {
    tasks.register('jacocoTestReport', JacocoReport) {
        dependsOn 'testDebugUnitTest'

        reports {
            xml.required = true
            html.required = true
        }

        def fileFilter = [
                '**/R.class',
                '**/R$*.class',
                '**/BuildConfig.*',
                '**/Manifest*.*',
                '**/*Test*.*',
                'android/**/*.*'
        ]

        def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
        def mainSrc = "${projectDir}/src/main/java"

        sourceDirectories.setFrom(files([mainSrc]))
        classDirectories.setFrom(files([debugTree]))
        executionData.setFrom(fileTree(dir: buildDir, includes: [
                'jacoco/testDebugUnitTest.exec',
                'outputs/code_coverage/debugAndroidTest/connected/**/*.ec'
        ]))
    }

    // ✅ CONFIGURATION DE LA TÂCHE AUTO-GÉNÉRÉE compileAppiumTestJava
    tasks.named('compileAppiumTestJava').configure {
        options.encoding = 'UTF-8'
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        doFirst {
            println "=========================================="
            println "🔧 COMPILATION DES TESTS APPIUM"
            println "Source: ${source.asPath}"
            println "Destination: ${destinationDirectory.get()}"
            println "=========================================="
        }

        doLast {
            println "✅ Compilation Appium terminée"
            def classFiles = fileTree(destinationDirectory.get()).files
            println "📦 ${classFiles.size()} classe(s) compilée(s)"
        }
    }
}

// ================================
// TÂCHE EXÉCUTION TESTS APPIUM (VIA JAVAEXEC)
// ================================
tasks.register('appiumTest', JavaExec) {
    description = 'Exécute tous les tests Appium E2E sur appareil réel'
    group = 'verification'

    dependsOn 'compileAppiumTestJava'

    // Configuration JUnit Platform Console Launcher
    mainClass = 'org.junit.platform.console.ConsoleLauncher'

    classpath = sourceSets.appiumTest.runtimeClasspath

    args = [
            '--scan-classpath',
            '--reports-dir', "${buildDir}/test-results/appiumTest",
            '--details', 'tree'
    ]

    // Variables d'environnement
    systemProperty 'appium.server', System.getProperty('appium.server', 'http://127.0.0.1:4723')

    doFirst {
        println "=========================================="
        println "🚀 DÉBUT DES TESTS APPIUM"
        println "Serveur Appium: ${systemProperties['appium.server']}"
        println "Nombre de classes: ${sourceSets.appiumTest.output.classesDirs.files.size()}"
        println "=========================================="
    }

    doLast {
        println "=========================================="
        println "✅ FIN DES TESTS APPIUM"
        println "Rapports: ${buildDir}/test-results/appiumTest/"
        println "=========================================="
    }
}

// ================================
// TÂCHE POUR LANCER UN TEST SPÉCIFIQUE
// ================================
tasks.register('appiumTestSingle', JavaExec) {
    description = 'Exécute un test Appium spécifique'
    group = 'verification'

    dependsOn 'compileAppiumTestJava'

    mainClass = 'org.junit.platform.console.ConsoleLauncher'
    classpath = sourceSets.appiumTest.runtimeClasspath

    def testClass = project.findProperty('testClass') ?: 'com.qos.latency.analyzer.appium.CompleteFlowAppiumTest'
    def testMethod = project.findProperty('testMethod') ?: 'testCompleteExecutionFlowWithVisualization'

    args = [
            '--select-method', "${testClass}#${testMethod}",
            '--reports-dir', "${buildDir}/test-results/appiumTest",
            '--details', 'tree'
    ]

    systemProperty 'appium.server', System.getProperty('appium.server', 'http://127.0.0.1:4723')

    doFirst {
        println "=========================================="
        println "🎯 EXÉCUTION D'UN TEST SPÉCIFIQUE"
        println "Test: ${testClass}#${testMethod}"
        println "Serveur Appium: ${systemProperties['appium.server']}"
        println "=========================================="
    }
}